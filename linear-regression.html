<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Regression Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="plot-container">
            <canvas id="scatter-plot"></canvas>
        </div>
        <div class="controls">
            <button id="clear-button">Clear</button>
        </div>
        <div class="results">
            <h3>Linear Regression Results</h3>
            <p>Slope: <span id="slope"></span></p>
            <p>Intercept: <span id="intercept"></span></p>
            <p>R Square: <span id="r-square"></span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
