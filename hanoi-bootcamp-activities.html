<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanoi — Activities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --oxford: #030C2C;
    --sunset: #EFCB9E;
    --white: #FFFFFF;
    --ink: #030C2C;
    --ink-mid: #3A3A46;
    --ink-soft: #8A8A96;
    --rule: #E0E0DC;
    --board-bg: #F2EDE4;
  }

  html { font-size: 16px; }

  body {
    background: var(--board-bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  /* ─────────────────────────────────────────
     BOARD VIEW
  ───────────────────────────────────────── */
  #board {
    padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 48px) 56px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .board-section { margin-bottom: clamp(28px, 4vw, 48px); }

  .board-section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 0.5px solid var(--rule);
  }

  /* Grid:
     mobile  (<480px):  2 columns
     tablet  (480–767): 3 columns
     laptop  (768–1099): 4 columns
     wide    (≥1100px): 5 columns, capped */
  .photo-grid {
    display: grid;
    gap: clamp(10px, 2vw, 18px);
    grid-template-columns: repeat(2, 1fr);
  }
  @media (min-width: 480px)  { .photo-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 768px)  { .photo-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1100px) { .photo-grid { grid-template-columns: repeat(5, 1fr); } }

  /* experience section — fewer items, don't over-stretch */
  .photo-grid.grid-experience {
    grid-template-columns: repeat(2, 1fr);
    max-width: 520px;
  }
  @media (min-width: 480px)  { .photo-grid.grid-experience { grid-template-columns: repeat(2, 1fr); max-width: 420px; } }

  /* individual photo card */
  .photo-card {
    cursor: pointer;
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 4/3;
    background: var(--oxford);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1),
                box-shadow 0.28s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 2px 10px rgba(3,12,44,0.18);
    /* cap max size on very large screens */
    max-width: 280px;
    width: 100%;
    justify-self: start;
  }
  /* on wide grid don't constrain — let grid handle it */
  .photo-grid:not(.grid-experience) .photo-card { max-width: none; }

  .photo-card:hover {
    transform: scale(1.04) rotate(0.3deg);
    box-shadow: 0 12px 32px rgba(3,12,44,0.28);
    z-index: 2;
  }
  /* touch devices: skip hover lift to avoid sticky states */
  @media (hover: none) {
    .photo-card:hover { transform: none; box-shadow: 0 2px 10px rgba(3,12,44,0.18); }
    .photo-card:active { transform: scale(0.97); }
  }

  .photo-card::before { display: none; }

  .photo-card-img {
    position: absolute;
    inset: 0;
    z-index: 1;
    object-fit: cover;
    width: 100%;
    height: 100%;
    border-radius: 4px;
  }

  .photo-card-placeholder {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    background: linear-gradient(145deg, #0D2248, #030C2C);
    border-radius: 4px;
  }

  /* gradient scrim */
  .photo-card::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    border-radius: 4px;
    background: linear-gradient(to top,
      rgba(3,12,44,0.88) 0%,
      rgba(3,12,44,0.12) 55%,
      transparent 100%);
  }

  .photo-card-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px 11px 13px;
    z-index: 3;
    display: flex;
    align-items: flex-end;
    min-height: 56px;
  }
  .photo-card-label span {
    font-size: clamp(10px, 1.2vw, 12px);
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: 0.02em;
    line-height: 1.35;
  }

  .photo-card-tag {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 4;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 2px;
  }
  .tag-expertise  { background: var(--oxford); color: var(--sunset); }
  .tag-experience { background: #0D2248;       color: #EFCB9E; }

  /* ─────────────────────────────────────────
     DETAIL VIEW
  ───────────────────────────────────────── */
  #detail {
    display: none;
    min-height: 100vh;
    background: var(--white);
  }

  /* detail header band — replaces hero image */
  .detail-header {
    background: var(--oxford);
    padding: clamp(28px, 5vw, 56px) clamp(18px, 5vw, 48px) clamp(24px, 4vw, 44px);
  }
  .detail-header-inner {
    max-width: 760px;
    margin: 0 auto;
  }

  /* sticky back bar */
  .detail-back {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--oxford);
    padding: 13px clamp(16px, 4vw, 32px);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .detail-back:hover { background: #0D2248; }
  .back-arrow {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid rgba(239,203,158,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sunset);
    flex-shrink: 0;
  }
  .detail-back-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--sunset);
    letter-spacing: 0.04em;
  }

  /* detail body — wider on laptop, comfortable on mobile */
  .detail-body {
    padding: clamp(24px, 4vw, 48px) clamp(18px, 5vw, 48px) 72px;
    max-width: 760px;
    margin: 0 auto;
  }

  .detail-category {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--sunset);
    opacity: 0.75;
    margin-bottom: 10px;
  }
  .detail-title {
    font-size: clamp(22px, 3.5vw, 34px);
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 12px;
  }
  .detail-meta {
    font-size: 12px;
    font-weight: 500;
    color: rgba(239,203,158,0.7);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
  }
  .detail-meta span { display: flex; align-items: center; gap: 5px; }
  .meta-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--sunset); opacity: 0.6; flex-shrink: 0; }

  .detail-divider {
    height: 0.5px;
    background: var(--rule);
    margin-bottom: 24px;
  }

  .detail-desc {
    font-size: clamp(13.5px, 1.5vw, 15px);
    color: var(--ink-mid);
    line-height: 1.78;
    margin-bottom: 28px;
  }

  .detail-highlights {
    background: #F7F4EF;
    border-left: 3px solid var(--sunset);
    border-radius: 0 4px 4px 0;
    padding: 18px 22px;
    margin-bottom: 28px;
  }
  .detail-highlights-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }
  .detail-highlights ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .detail-highlights li {
    display: flex;
    gap: 11px;
    font-size: clamp(13px, 1.4vw, 14px);
    color: var(--ink-mid);
    line-height: 1.55;
  }
  .hi-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--sunset);
    flex-shrink: 0;
    margin-top: 7px;
  }

  .detail-quote {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-size: clamp(13.5px, 1.5vw, 15px);
    color: var(--oxford);
    line-height: 1.68;
    padding: 18px 0;
    border-top: 0.5px solid var(--rule);
    border-bottom: 0.5px solid var(--rule);
    margin-bottom: 24px;
  }

  @media (prefers-reduced-motion: reduce) {
    .photo-card, .photo-card:hover, .photo-card:active { transition: none; transform: none; }
  }
</style>
</head>
