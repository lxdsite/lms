<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle Student Response Viewer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (to compile JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Print Styles -->
    <style>
        /* A4 Page Styling for Web View */
        .a4-page {
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: white;
            padding: 20mm;
            box-sizing: border-box;
            position: relative;
        }

        @media print {
            @page { 
                size: A4; 
                margin: 1.5cm; /* Browser handles margins */
            }
            body { 
                background: white; 
                margin: 0;
                /* Formal Serif Font for Print */
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-size: 11pt;
                color: #000;
            }
            .no-print { display: none !important; }
            
            .a4-page {
                margin: 0;
                width: 100%;
                max-width: none;
                min-height: auto;
                padding: 0;
                box-shadow: none;
            }

            /* Professional Section Styling */
            .student-section {
                break-inside: avoid;
                page-break-after: always; /* Start each student on new page */
                border-bottom: none !important;
                margin-bottom: 0 !important;
            }
            
            /* Student Header */
            .student-header {
                border-bottom: 2px solid #000 !important;
                margin-bottom: 1.5rem !important;
                padding-bottom: 0.5rem !important;
                background: transparent !important;
            }
            .student-name {
                font-size: 18pt !important;
                font-weight: bold !important;
                color: #000 !important;
            }

            /* Activity Item Styling */
            .activity-container {
                border: none !important;
                padding: 0 !important;
                margin-bottom: 2rem !important;
            }
            .activity-header {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                border-bottom: 1px solid #ccc;
                margin-bottom: 0.5rem;
                padding-bottom: 0.25rem;
            }
            .activity-title {
                font-size: 12pt !important;
                font-weight: bold !important;
            }
            .activity-type-badge {
                border: 1px solid #000 !important;
                background: transparent !important;
                color: #000 !important;
                border-radius: 0 !important;
                padding: 1px 6px !important;
                font-size: 8pt !important;
                font-weight: normal !important;
            }
            .activity-content {
                font-size: 11pt !important;
                line-height: 1.5 !important;
                text-align: justify;
                border-left: none !important;
                padding-left: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons (Inline SVGs) ---
        const Icon = ({ path, className = "h-6 w-6" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <g dangerouslySetInnerHTML={{ __html: path }} />
            </svg>
        );

        const Icons = {
            Upload: (props) => <Icon {...props} path='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>' />,
            FileText: (props) => <Icon {...props} path='<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/>' />,
            Printer: (props) => <Icon {...props} path='<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>' />,
            AlertCircle: (props) => <Icon {...props} path='<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>' />,
            MessageSquare: (props) => <Icon {...props} path='<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' />,
            Calendar: (props) => <Icon {...props} path='<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>' />,
            User: (props) => <Icon {...props} path='<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' />,
            Layers: (props) => <Icon {...props} path='<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>' />,
            ArrowUp: (props) => <Icon {...props} path='<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>' />,
            ArrowDown: (props) => <Icon {...props} path='<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>' />,
            Trash: (props) => <Icon {...props} path='<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' />
        };

        // --- Utils ---
        const cleanContent = (htmlContent, entryMap = {}) => {
            if (!htmlContent) return "";
            const txt = document.createElement("textarea");
            txt.innerHTML = htmlContent;
            let decoded = txt.value;

            // Replace internal images with placeholder logic
            decoded = decoded.replace(/src="portfolio:([^"]+)"/g, (match, id) => {
                const fileEntry = entryMap[`portfolio:${id}`];
                const fileName = fileEntry ? fileEntry.title : "Image";
                return `src="" data-original-src="${match}" alt="[Attached Image: ${fileName}]" class="broken-image-placeholder"`;
            });
            return decoded;
        };

        const formatDate = (dateString) => {
            if (!dateString) return "Unknown Date";
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return dateString;
            return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        };

        // --- Parsing Logic ---

        const parseJSON = (text, fileName) => {
            try {
                let data = JSON.parse(text);
                // Handle nested Moodle export arrays [[{...}]]
                if (Array.isArray(data) && data.length > 0 && Array.isArray(data[0])) {
                    data = data[0];
                }
                if (!Array.isArray(data)) return [];

                return data.map((entry, index) => {
                    let contentHtml = "";
                    let i = 1;
                    // Build Q&A content
                    while(entry[`question${i}`] || entry[`response${i}`]) {
                        const q = entry[`question${i}`];
                        const r = entry[`response${i}`];
                        contentHtml += `<div class="mb-4 border-b border-gray-100 pb-3 last:border-0 print:border-gray-300">`;
                        if (q) contentHtml += `<div class="mb-1 text-xs font-bold text-blue-800 uppercase tracking-wide print:text-black print:font-bold">Question ${i}</div><div class="mb-2 font-medium text-gray-900 text-sm print:text-black">${q}</div>`;
                        if (r) contentHtml += `<div class="bg-gray-50 p-3 rounded border border-gray-100 text-gray-800 text-sm print:bg-white print:border-none print:pl-0 print:italic">${r}</div>`;
                        contentHtml += `</div>`;
                        i++;
                    }
                    if (!contentHtml && (entry.intro || entry.feedback)) {
                        contentHtml = `<p>${entry.intro || ""}</p><p>${entry.feedback || ""}</p>`;
                    }

                    return {
                        id: `json-${fileName}-${index}`,
                        studentName: `${entry.firstname} ${entry.lastname}`.trim(),
                        activityType: 'Quiz',
                        activityName: fileName.replace('.json', '').replace(/-responses$/, '').replace(/_/g, ' '),
                        sourceFileName: fileName,
                        date: entry.completed || entry.timecreated,
                        content: contentHtml
                    };
                });
            } catch (err) {
                console.error("JSON Parse Error", err);
                return [];
            }
        };

        const parseXML = (text, fileName) => {
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, "text/xml");
                if (doc.querySelector("parsererror")) return [];

                const feedTitle = doc.querySelector("feed > title")?.textContent || "Forum Export";
                const entries = Array.from(doc.querySelectorAll("entry"));

                const entryMap = {};
                entries.forEach(entry => {
                    const id = entry.querySelector("id")?.textContent;
                    if (id) {
                        entryMap[id] = {
                            id,
                            title: entry.querySelector("title")?.textContent || "Untitled",
                            author: entry.querySelector("author > name")?.textContent || "Unknown Student",
                            published: entry.querySelector("published")?.textContent,
                            content: entry.querySelector("content")?.textContent || "",
                            links: Array.from(entry.querySelectorAll("link")).map(link => ({
                                rel: link.getAttribute("rel"),
                                href: link.getAttribute("href")
                            })),
                            categories: Array.from(entry.querySelectorAll("category")).map(cat => ({
                                term: cat.getAttribute("term")
                            }))
                        };
                    }
                });

                const results = [];
                const processedIds = new Set();

                // 1. Process Discussions (Groupings)
                Object.values(entryMap).forEach(entry => {
                    const isSelection = entry.categories.some(c => c.term === "Selection" || c.term === "Grouping") || 
                                        entry.links.some(l => l.rel === "leap2:has_part");

                    if (isSelection) {
                        // It's a discussion thread
                        const parts = entry.links
                            .filter(l => l.rel === "leap2:has_part")
                            .map(l => entryMap[l.href])
                            .filter(Boolean);
                        
                        parts.forEach(post => {
                            processedIds.add(post.id);
                            results.push({
                                id: post.id,
                                studentName: post.author,
                                activityType: 'Forum',
                                activityName: entry.title, // Group Title (e.g., Discussion Topic)
                                sourceFileName: fileName,
                                date: post.published,
                                content: cleanContent(post.content, entryMap),
                                postTitle: post.title
                            });
                        });
                    }
                });

                // 2. Process Orphans (Standalone posts)
                Object.values(entryMap).forEach(entry => {
                    const isSelection = entry.categories.some(c => c.term === "Selection" || c.term === "Grouping");
                    const isAttachment = entry.id.includes("storedfile");
                    
                    if (!isSelection && !isAttachment && !processedIds.has(entry.id)) {
                        results.push({
                            id: entry.id,
                            studentName: entry.author,
                            activityType: 'Forum Post',
                            activityName: feedTitle, // Fallback to Feed Title
                            sourceFileName: fileName,
                            date: entry.published,
                            content: cleanContent(entry.content, entryMap),
                            postTitle: entry.title
                        });
                    }
                });

                return results;

            } catch (err) {
                console.error("XML Parse Error", err);
                return [];
            }
        };


        // --- Main App Component ---
        function App() {
            const [uploadedFiles, setUploadedFiles] = useState([]); // Array of { name, content }
            const [studentGroups, setStudentGroups] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [dragActive, setDragActive] = useState(false);

            // Process files whenever the file list changes
            useEffect(() => {
                if (uploadedFiles.length === 0) {
                    setStudentGroups(null);
                    return;
                }

                try {
                    setLoading(true);
                    let allPosts = [];

                    // Parse files in order
                    uploadedFiles.forEach(({name, content}) => {
                        if (name.toLowerCase().endsWith('.json') || content.trim().startsWith('[')) {
                            allPosts = [...allPosts, ...parseJSON(content, name)];
                        } else {
                            allPosts = [...allPosts, ...parseXML(content, name)];
                        }
                    });

                    // Group by Student
                    const groups = {};
                    allPosts.forEach(post => {
                        const name = post.studentName || "Unknown Student";
                        if (!groups[name]) groups[name] = [];
                        groups[name].push(post);
                    });

                    // Sort: Student Name A-Z
                    const sortedStudentNames = Object.keys(groups).sort();
                    
                    // Sort activities within student by File Order (then by Date)
                    const fileOrderMap = uploadedFiles.reduce((acc, file, idx) => {
                        acc[file.name] = idx;
                        return acc;
                    }, {});

                    const sortedGroups = {};
                    sortedStudentNames.forEach(name => {
                        groups[name].sort((a, b) => {
                            // Primary Sort: File Order
                            const orderA = fileOrderMap[a.sourceFileName] ?? 999;
                            const orderB = fileOrderMap[b.sourceFileName] ?? 999;
                            if (orderA !== orderB) return orderA - orderB;
                            
                            // Secondary Sort: Date
                            return new Date(a.date) - new Date(b.date);
                        });
                        sortedGroups[name] = groups[name];
                    });

                    setStudentGroups(sortedGroups);
                    setError(null);
                } catch (err) {
                    setError("Error processing files: " + err.message);
                } finally {
                    setLoading(false);
                }

            }, [uploadedFiles]);

            const handleFilesRead = async (fileList) => {
                setLoading(true);
                try {
                    const readers = Array.from(fileList).map(file => {
                        return new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (e) => resolve({ 
                                name: file.name, 
                                content: e.target.result 
                            });
                            reader.readAsText(file);
                        });
                    });

                    const newFiles = await Promise.all(readers);
                    // Append new files to existing ones
                    setUploadedFiles(prev => [...prev, ...newFiles]);
                } catch (err) {
                    setError("Error reading files");
                } finally {
                    setLoading(false);
                }
            };

            const handleFileUpload = (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFilesRead(e.target.files);
                }
            };

            const handleDrag = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.type === "dragenter" || e.type === "dragover") {
                    setDragActive(true);
                } else if (e.type === "dragleave") {
                    setDragActive(false);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragActive(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFilesRead(e.dataTransfer.files);
                }
            };

            const moveFile = (index, direction) => {
                const newFiles = [...uploadedFiles];
                const targetIndex = index + direction;
                if (targetIndex >= 0 && targetIndex < newFiles.length) {
                    [newFiles[index], newFiles[targetIndex]] = [newFiles[targetIndex], newFiles[index]];
                    setUploadedFiles(newFiles);
                }
            };

            const removeFile = (index) => {
                const newFiles = uploadedFiles.filter((_, i) => i !== index);
                setUploadedFiles(newFiles);
            };

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="min-h-screen flex flex-col bg-gray-50">
                    {/* Navigation */}
                    <nav className="bg-blue-900 text-white shadow-md no-print sticky top-0 z-50">
                        <div className="container mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <Icons.Layers className="h-6 w-6" />
                                <span className="font-bold text-lg">Student Response Organizer</span>
                            </div>
                            {studentGroups && (
                                <div className="flex gap-4 items-center">
                                    <span className="text-sm bg-blue-800 py-1 px-3 rounded-full hidden md:inline-block">
                                        {Object.keys(studentGroups).length} Students
                                    </span>
                                    <button 
                                        onClick={handlePrint}
                                        className="flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded transition-colors"
                                    >
                                        <Icons.Printer className="h-4 w-4" />
                                        Print / PDF
                                    </button>
                                </div>
                            )}
                        </div>
                    </nav>

                    <main className="container mx-auto px-4 py-8 flex-grow">
                        
                        {/* File Manager Section (Visible if files exist) */}
                        {uploadedFiles.length > 0 && (
                            <div className="max-w-4xl mx-auto mb-8 bg-white rounded-lg shadow-sm border border-gray-200 p-6 no-print">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-bold text-gray-800">File Order (Activities)</h2>
                                    <label className="cursor-pointer text-sm bg-blue-50 text-blue-600 px-3 py-1.5 rounded hover:bg-blue-100 font-medium transition-colors">
                                        + Add More Files
                                        <input 
                                            type="file" 
                                            className="hidden" 
                                            multiple 
                                            accept=".xml,.json"
                                            onChange={handleFileUpload}
                                        />
                                    </label>
                                </div>
                                <p className="text-sm text-gray-500 mb-4">
                                    Drag or use arrows to reorder. Student reports will list activities in this exact order.
                                </p>
                                <div className="space-y-2">
                                    {uploadedFiles.map((file, idx) => (
                                        <div key={idx} className="flex items-center gap-3 bg-gray-50 p-3 rounded border border-gray-200">
                                            <div className="text-gray-400 font-mono text-xs w-6 text-center">{idx + 1}</div>
                                            <div className="flex-grow font-medium text-gray-700 truncate">{file.name}</div>
                                            <div className="flex items-center gap-1">
                                                <button 
                                                    onClick={() => moveFile(idx, -1)} 
                                                    disabled={idx === 0}
                                                    className="p-1 hover:bg-gray-200 rounded disabled:opacity-30"
                                                    title="Move Up"
                                                >
                                                    <Icons.ArrowUp className="h-4 w-4 text-gray-600" />
                                                </button>
                                                <button 
                                                    onClick={() => moveFile(idx, 1)} 
                                                    disabled={idx === uploadedFiles.length - 1}
                                                    className="p-1 hover:bg-gray-200 rounded disabled:opacity-30"
                                                    title="Move Down"
                                                >
                                                    <Icons.ArrowDown className="h-4 w-4 text-gray-600" />
                                                </button>
                                                <div className="w-px h-4 bg-gray-300 mx-1"></div>
                                                <button 
                                                    onClick={() => removeFile(idx)}
                                                    className="p-1 hover:bg-red-100 rounded group"
                                                    title="Remove File"
                                                >
                                                    <Icons.Trash className="h-4 w-4 text-gray-400 group-hover:text-red-500" />
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Upload Box (Visible only if no files) */}
                        {uploadedFiles.length === 0 && (
                            <div className="max-w-xl mx-auto mt-12">
                                <div 
                                    className={`border-2 border-dashed rounded-xl p-12 text-center transition-colors cursor-pointer
                                        ${dragActive ? 'border-blue-500 bg-blue-50' : 'border-gray-300 bg-white hover:border-blue-400'}
                                    `}
                                    onDragEnter={handleDrag}
                                    onDragLeave={handleDrag}
                                    onDragOver={handleDrag}
                                    onDrop={handleDrop}
                                >
                                    <input 
                                        type="file" 
                                        id="file-upload" 
                                        className="hidden" 
                                        multiple 
                                        accept=".xml,.json"
                                        onChange={handleFileUpload}
                                    />
                                    <label htmlFor="file-upload" className="cursor-pointer block">
                                        <div className="flex justify-center mb-4">
                                            <Icons.Upload className="h-16 w-16 text-gray-400" />
                                        </div>
                                        <h3 className="text-xl font-semibold text-gray-700 mb-2">Upload Moodle Exports</h3>
                                        <p className="text-gray-500 mb-6">
                                            Drag and drop multiple files<br/>
                                            (<code>.xml</code> Forums and <code>.json</code> Quizzes)
                                        </p>
                                        <span className="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors">
                                            Select Files
                                        </span>
                                    </label>
                                </div>
                                
                                {loading && (
                                    <div className="mt-6 text-center text-blue-600 animate-pulse">
                                        Processing files...
                                    </div>
                                )}

                                {error && (
                                    <div className="mt-6 bg-red-50 border-l-4 border-red-500 p-4 rounded flex items-start gap-3">
                                        <Icons.AlertCircle className="h-5 w-5 text-red-500 mt-0.5" />
                                        <p className="text-red-700">{error}</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Report Section */}
                        {studentGroups && (
                            <div className="a4-page">
                                <div className="mb-8 border-b-2 border-gray-800 pb-4 no-print">
                                    <div className="flex items-center gap-2 text-gray-500 mb-2">
                                        <span className="text-xs font-semibold uppercase tracking-wider">Student Report (A4)</span>
                                    </div>
                                    <h1 className="text-3xl font-bold text-gray-900 mb-2">Student Activity Report</h1>
                                    <p className="text-gray-500 text-sm">
                                        Generated on {new Date().toLocaleDateString()} • {uploadedFiles.length} activities
                                    </p>
                                </div>

                                {/* Formal Cover Sheet for Print (Optional but good for reports) */}
                                <div className="hidden print:block mb-12 pb-6 border-b-2 border-black">
                                    <h1 className="text-3xl font-bold mb-2">Student Activity Report</h1>
                                    <p className="text-sm">Generated on {new Date().toLocaleDateString()}</p>
                                </div>

                                <div className="space-y-12">
                                    {Object.entries(studentGroups).map(([studentName, posts]) => (
                                        <div key={studentName} className="student-section">
                                            {/* Screen Header */}
                                            <div className="flex items-center gap-3 mb-6 bg-gray-100 p-3 rounded-lg print:hidden">
                                                <div className="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-lg">
                                                    {studentName.charAt(0).toUpperCase()}
                                                </div>
                                                <h2 className="text-2xl font-bold text-gray-900">{studentName}</h2>
                                                <span className="ml-auto text-sm text-gray-500 font-medium bg-white px-2 py-1 rounded shadow-sm">
                                                    {posts.length} Activities
                                                </span>
                                            </div>

                                            {/* Print Header */}
                                            <div className="student-header hidden print:block">
                                                <div className="student-name">{studentName}</div>
                                            </div>

                                            <div className="space-y-6 pl-4 border-l-2 border-gray-100 print:pl-0 print:border-l-0">
                                                {posts.map((post) => (
                                                    <StudentActivityItem key={post.id} post={post} />
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-gray-100 border-t border-gray-200 py-8 mt-auto no-print">
                        <div className="container mx-auto px-4 text-center text-gray-500 text-sm">
                            <p>Processing happens entirely in your browser.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        // --- Activity Item Component ---
        function StudentActivityItem({ post }) {
            const contentRef = useRef(null);

            useEffect(() => {
                if (contentRef.current && post.content) {
                    contentRef.current.innerHTML = post.content;
                    
                    // Formatting Fixes
                    const tables = contentRef.current.querySelectorAll('table');
                    tables.forEach(table => {
                        table.classList.add('w-full', 'border-collapse', 'my-2', 'text-sm');
                        table.querySelectorAll('td, th').forEach(cell => cell.classList.add('border', 'border-gray-300', 'p-2'));
                    });
                    
                    const brokenImages = contentRef.current.querySelectorAll('.broken-image-placeholder');
                    brokenImages.forEach(img => {
                        const wrapper = document.createElement('div');
                        wrapper.className = "bg-gray-50 border border-gray-200 rounded p-2 my-1 text-center text-gray-400 text-xs italic print:border print:border-black print:text-black";
                        wrapper.textContent = `[Image: ${img.getAttribute('alt') || 'Attachment'}]`;
                        img.parentNode.replaceChild(wrapper, img);
                    });
                }
            }, [post.content]);

            return (
                <div className="avoid-break mb-8 last:mb-0 activity-container">
                    <div className="flex items-baseline justify-between mb-2 activity-header">
                        <div className="flex items-center gap-2">
                            <span className={`text-xs font-bold px-2 py-0.5 rounded uppercase tracking-wider activity-type-badge ${
                                post.activityType === 'Quiz' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'
                            }`}>
                                {post.activityType}
                            </span>
                            <h3 className="font-bold text-gray-800 text-lg leading-tight activity-title">
                                {post.activityName}
                            </h3>
                        </div>
                        <span className="text-xs text-gray-500 whitespace-nowrap flex items-center gap-1 print:text-black">
                            <Icons.Calendar className="h-3 w-3 print:hidden" />
                            {formatDate(post.date)}
                        </span>
                    </div>

                    {post.postTitle && post.postTitle !== "Untitled" && (
                        <div className="text-sm font-medium text-gray-600 mb-2 italic print:text-black">
                            Subject: {post.postTitle}
                        </div>
                    )}

                    <div className="bg-white rounded border-l-4 border-gray-200 pl-4 py-1 activity-content">
                        <div 
                            ref={contentRef}
                            className="prose prose-sm max-w-none text-gray-700 leading-relaxed 
                                [&_p]:mb-2 last:[&_p]:mb-0
                                [&_ul]:list-disc [&_ul]:pl-5
                                [&_ol]:list-decimal [&_ol]:pl-5
                                print:text-black"
                        />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
