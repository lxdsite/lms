<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle Forum Analytics</title>

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Required dependencies for Recharts UMD build -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>

    <!-- Babel for rendering React inside the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts for graphs (Pinned to a stable compatible version) -->
    <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js" crossorigin></script>

    <style>
        body { background-color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
<!-- The React App will render inside this div -->
<div id="root"></div>

<script type="text/babel">
    const { useState, useMemo } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

    // --- Icons ---
    const IconMessageSquare = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>);
    const IconUploadCloud = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path><polyline points="16 16 12 12 8 16"></polyline></svg>);
    const IconAlertCircle = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>);
    const IconFileJson = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="15" x2="15" y2="15"></line></svg>);
    const IconMessageCircle = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>);
    const IconFilter = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>);
    const IconXCircle = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>);
    const IconEdit3 = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>);
    const IconUsers = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>);
    const IconLayoutList = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="3" width="7" height="7" rx="1"></rect><line x1="14" y1="4" x2="21" y2="4"></line><line x1="14" y1="9" x2="21" y2="9"></line><line x1="14" y1="15" x2="21" y2="15"></line><line x1="14" y1="20" x2="21" y2="20"></line></svg>);
    const IconDownloadCloud = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="8 17 12 21 16 17"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"></path></svg>);
    const IconShare = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>);

    const COLORS = [
        '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
        '#ec4899', '#14b8a6', '#f97316', '#06b6d4', '#84cc16',
        '#6366f1', '#d946ef', '#f43f5e', '#0ea5e9', '#10b981'
    ];

    // --- Custom Tooltip to show Total Posts along with the breakdown ---
    const CustomTooltip = ({ active, payload, label }) => {
        if (active && payload && payload.length) {
            const dataRow = payload[0].payload;
            const total = dataRow.totalPosts;

            return (
                <div className="bg-white p-3 rounded-lg border border-slate-200 shadow-lg text-sm min-w-[200px]">
                    <p className="font-bold text-slate-800 border-b border-slate-100 pb-2 mb-2 flex justify-between items-center">
                        <span>{label}</span>
                        <span className="text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full text-xs ml-3">
                                {total} Total Posts
                            </span>
                    </p>
                    {payload.map((entry, index) => (
                        <div key={index} className="flex items-center gap-2 py-1">
                            <div className="w-3 h-3 rounded-sm shadow-sm shrink-0" style={{ backgroundColor: entry.color }}></div>
                            <span className="text-slate-600 truncate max-w-[200px]">{entry.name}:</span>
                            <span className="font-semibold text-slate-800 ml-auto">{entry.value}</span>
                        </div>
                    ))}
                </div>
            );
        }
        return null;
    };

    function App() {
        // Check if there is pre-loaded data injected by the "Share HTML" feature
        const [data, setData] = useState(() => window.__INITIAL_DATA__ || null);
        const [error, setError] = useState(null);
        const [isLoading, setIsLoading] = useState(false);

        const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            setIsLoading(true);
            setError(null);

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const json = JSON.parse(event.target.result);
                    const flatData = Array.isArray(json[0]) ? json.flat() : json;

                    if (flatData.length === 0 || !flatData[0].hasOwnProperty('time')) {
                        throw new Error("Invalid log format. Ensure you are uploading a Moodle JSON log export.");
                    }

                    setData(flatData);
                } catch (err) {
                    setError(err.message || "Failed to parse JSON file.");
                } finally {
                    setIsLoading(false);
                }
            };
            reader.onerror = () => {
                setError("Error reading the file.");
                setIsLoading(false);
            };

            reader.readAsText(file);
        };

        const resetData = () => {
            setData(null);
            setError(null);
            window.__INITIAL_DATA__ = null; // Clear pre-loaded data if they want to start fresh
        };

        return (
            <div className="min-h-screen text-slate-800 font-sans">
                {!data ? (
                    <div className="flex flex-col items-center justify-center min-h-screen p-6">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-100">
                            <div className="w-20 h-20 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-6">
                                <IconMessageSquare size={40} />
                            </div>
                            <h1 className="text-2xl font-bold text-slate-900 mb-2">Forum Analytics</h1>
                            <p className="text-slate-500 mb-8">
                                Upload your Moodle log export to see exactly who is posting, how much, and in which forums.
                            </p>

                            <label className="relative flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-indigo-200 rounded-xl cursor-pointer bg-indigo-50/50 hover:bg-indigo-50 transition-colors group">
                                <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                    <IconUploadCloud size={40} className="text-indigo-400 mb-3 group-hover:text-indigo-500 transition-colors" />
                                    <p className="mb-2 text-sm text-indigo-600 font-medium">Click to upload logs</p>
                                    <p className="text-xs text-indigo-400">JSON log files only</p>
                                </div>
                                <input type="file" className="hidden" accept=".json,application/json" onChange={handleFileUpload} />
                            </label>

                            {isLoading && <p className="mt-4 text-indigo-500 animate-pulse font-medium">Analyzing forum data...</p>}

                            {error && (
                                <div className="mt-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-center gap-2 text-left">
                                    <IconAlertCircle size={16} className="shrink-0" />
                                    <p>{error}</p>
                                </div>
                            )}
                        </div>
                    </div>
                ) : (
                    <Dashboard data={data} onReset={resetData} />
                )}
            </div>
        );
    }

    function Dashboard({ data, onReset }) {
        const [selectedForum, setSelectedForum] = useState('All');
        const [selectedStudent, setSelectedStudent] = useState('All');

        const baseData = useMemo(() => {
            const events = [];
            const forumsSet = new Set();
            const studentsSet = new Set();
            let extractedCourseName = "Unknown Course";

            data.forEach(row => {
                const comp = (row.component || '').toLowerCase();
                const ctx = (row.eventcontext || '');
                const evtName = (row.eventname || '').toLowerCase();
                const user = row.userfullname;

                // Extract Course Name once
                if (extractedCourseName === "Unknown Course" && ctx.startsWith('Course: ')) {
                    extractedCourseName = ctx.substring(8).trim();
                }

                if (!comp.includes('forum') && !ctx.toLowerCase().includes('forum')) return;
                if (!user || user === '-' || user === 'System') return;

                let forumName = ctx;
                if (ctx.startsWith('Forum: ')) forumName = ctx.substring(7).trim();
                else if (ctx.startsWith('Course module: ')) forumName = ctx.substring(15).trim();

                // Strictly isolate active posting: creating a post, creating a discussion, or updating a post.
                // Exclude any passive/mention logs (like viewed, mentioned)
                const isPost = (evtName.includes('post created') ||
                        evtName.includes('discussion created') ||
                        evtName.includes('post updated')) &&
                    !evtName.includes('viewed') &&
                    !evtName.includes('mentioned');

                const isView = evtName.includes('viewed');

                if (isPost || isView) {
                    events.push({ user, forumName, isPost, isView });
                    forumsSet.add(forumName);
                    studentsSet.add(user);
                }
            });

            return {
                events,
                allForums: Array.from(forumsSet).sort(),
                allStudents: Array.from(studentsSet).sort(),
                courseName: extractedCourseName
            };
        }, [data]);

        const processed = useMemo(() => {
            let totalPosts = 0;
            let totalViews = 0;

            const studentStats = {};
            const forumStats = {};
            const activeForumsSet = new Set();

            baseData.events.forEach(ev => {
                if (selectedForum !== 'All' && ev.forumName !== selectedForum) return;
                if (selectedStudent !== 'All' && ev.user !== selectedStudent) return;

                if (!studentStats[ev.user]) {
                    studentStats[ev.user] = { name: ev.user, totalPosts: 0, totalViews: 0, forums: {} };
                }
                if (!forumStats[ev.forumName]) {
                    forumStats[ev.forumName] = { name: ev.forumName, posts: 0, views: 0 };
                }

                if (ev.isPost) {
                    activeForumsSet.add(ev.forumName);
                    totalPosts++;
                    studentStats[ev.user].totalPosts++;
                    forumStats[ev.forumName].posts++;
                    studentStats[ev.user].forums[ev.forumName] = (studentStats[ev.user].forums[ev.forumName] || 0) + 1;
                } else if (ev.isView) {
                    totalViews++;
                    studentStats[ev.user].totalViews++;
                    forumStats[ev.forumName].views++;
                }
            });

            const posters = Object.values(studentStats)
                .filter(s => s.totalPosts > 0)
                .sort((a, b) => b.totalPosts - a.totalPosts)
                .map(s => {
                    return { name: s.name, totalPosts: s.totalPosts, ...s.forums };
                });

            const topForums = Object.values(forumStats)
                .filter(f => f.posts > 0)
                .sort((a, b) => b.posts - a.posts);

            return {
                totalPosts,
                totalViews,
                activePostersCount: posters.length,
                activeForums: Array.from(activeForumsSet),
                posters,
                topForums
            };
        }, [baseData, selectedForum, selectedStudent]);

        const handleExportCSV = () => {
            // Determine which forums to list as columns (If filtered to one, just show one; otherwise all)
            const forumColumns = selectedForum === 'All' ? baseData.allForums : [selectedForum];

            // Helper to escape CSV strings
            const escapeCSV = (str) => `"${String(str).replace(/"/g, '""')}"`;

            // Build dynamic headers
            const headers = [
                "Student Name",
                "Student Email",
                ...forumColumns.map(escapeCSV),
                "Total Posts",
                "Grading Column"
            ];
            const csvRows = [headers.join(",")];

            // We map over ALL valid students so the instructor gets a complete grading sheet
            // (including students with 0 posts).
            baseData.allStudents.forEach(studentName => {
                // Respect the specific student filter if one is applied
                if (selectedStudent !== 'All' && studentName !== selectedStudent) return;

                // Find if they have posts
                const studentData = processed.posters.find(p => p.name === studentName);

                // Start building the row
                const row = [
                    escapeCSV(studentName),
                    `""` // Email (often empty in Moodle standard log exports)
                ];

                // Append the count for each forum column
                forumColumns.forEach(forumName => {
                    const count = studentData && studentData[forumName] ? studentData[forumName] : 0;
                    row.push(count);
                });

                // Append the Total Posts and empty Grading Column
                const totalPosts = studentData ? studentData.totalPosts : 0;
                row.push(totalPosts);
                row.push(`""`);

                csvRows.push(row.join(","));
            });

            // Generate file
            const csvContent = "data:text/csv;charset=utf-8," + csvRows.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);

            // Clean file name
            const date = new Date().toISOString().split('T')[0];
            const safeForumName = selectedForum === 'All' ? 'All_Forums' : selectedForum.replace(/[^a-z0-9]/gi, '_');
            link.setAttribute("download", `Grades_${safeForumName}_${date}.csv`);

            // Trigger download
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const handleExportHTML = () => {
            // Grab the raw React code embedded in this file
            const babelScript = document.querySelector('script[type="text/babel"]').innerHTML;

            // Serialize the uploaded data cleanly
            // We replace '<' to prevent XSS escaping issues in the JSON block
            const dataString = JSON.stringify(data).replace(/</g, '\\u003c');

            const htmlTemplate = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle Forum Analytics (Shared)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"><\/script>

    <!-- React & Recharts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin><\/script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin><\/script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"><\/script>
    <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"><\/script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
    <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js" crossorigin><\/script>

    <style>
        body { background-color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <!-- INJECTED DATA -->
    <script>window.__INITIAL_DATA__ = ${dataString};<\/script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">${babelScript}<\/script>
</body>
</html>`;

            // Generate HTML file for download
            const blob = new Blob([htmlTemplate], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            const date = new Date().toISOString().split('T')[0];
            link.download = `Shared_Forum_Dashboard_${date}.html`;

            // Trigger download
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        const chartHeight = Math.max(400, processed.posters.length * 45);

        return (
            <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6">
                {/* Header */}
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <div className="flex items-center gap-3">
                        <div className="p-2 bg-indigo-100 text-indigo-600 rounded-lg">
                            <IconMessageCircle size={24} />
                        </div>
                        <div>
                            <div className="flex items-center gap-2 mb-1">
                                <h1 className="text-xl font-bold text-slate-800">Forum Analytics</h1>
                                <span className="text-xs font-bold uppercase tracking-wider text-indigo-700 bg-indigo-100 px-2 py-1 rounded-md border border-indigo-200">
                                        {baseData.courseName}
                                    </span>
                            </div>
                            <p className="text-sm text-slate-500">Showing only actual posts and discussions created</p>
                        </div>
                    </div>
                    <div className="flex flex-wrap gap-2 md:gap-3">
                        <button
                            onClick={handleExportHTML}
                            className="flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors font-medium text-sm shadow-sm shrink-0"
                        >
                            <IconShare size={16} />
                            Share HTML
                        </button>
                        <button
                            onClick={handleExportCSV}
                            className="flex items-center justify-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors font-medium text-sm shadow-sm shrink-0"
                        >
                            <IconDownloadCloud size={16} />
                            Export CSV
                        </button>
                        <button
                            onClick={onReset}
                            className="flex items-center justify-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors font-medium text-sm shrink-0"
                        >
                            <IconFileJson size={16} />
                            New File
                        </button>
                    </div>
                </div>

                {/* FILTER CONTROLS */}
                <div className="flex flex-col md:flex-row items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <div className="flex items-center gap-2 shrink-0 w-full md:w-auto">
                        <IconFilter size={18} className="text-slate-400" />
                        <span className="font-semibold text-slate-700 text-sm">Filters:</span>
                    </div>

                    <div className="flex flex-col sm:flex-row w-full gap-3">
                        <select
                            value={selectedForum}
                            onChange={(e) => setSelectedForum(e.target.value)}
                            className="flex-1 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2.5 outline-none transition-colors"
                        >
                            <option value="All">All Forums</option>
                            {baseData.allForums.map(f => <option key={f} value={f}>{f}</option>)}
                        </select>

                        <select
                            value={selectedStudent}
                            onChange={(e) => setSelectedStudent(e.target.value)}
                            className="flex-1 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2.5 outline-none transition-colors"
                        >
                            <option value="All">All Students</option>
                            {baseData.allStudents.map(s => <option key={s} value={s}>{s}</option>)}
                        </select>

                        {(selectedForum !== 'All' || selectedStudent !== 'All') && (
                            <button
                                onClick={() => { setSelectedForum('All'); setSelectedStudent('All'); }}
                                className="flex items-center justify-center gap-1.5 px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg transition-colors text-sm font-medium shrink-0"
                            >
                                <IconXCircle size={16} />
                                Clear
                            </button>
                        )}
                    </div>
                </div>

                {/* Stats Cards */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <StatCard
                        icon={<IconEdit3 size={24} className="text-indigo-500" />}
                        title="Filtered Posts Made"
                        value={processed.totalPosts.toLocaleString()}
                        bg="bg-indigo-50"
                    />
                    <StatCard
                        icon={<IconUsers size={24} className="text-emerald-500" />}
                        title="Active Students"
                        value={processed.activePostersCount.toLocaleString()}
                        bg="bg-emerald-50"
                    />
                    <StatCard
                        icon={<IconLayoutList size={24} className="text-amber-500" />}
                        title="Filtered Forums"
                        value={processed.activeForums.length.toLocaleString()}
                        bg="bg-amber-50"
                    />
                </div>

                {/* Main Feature: Student Posting Breakdown */}
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <div className="mb-4">
                        <h2 className="text-lg font-semibold text-slate-800 flex items-center gap-2">
                            <IconUsers size={18} className="text-slate-400" />
                            Student Participation
                        </h2>
                        <p className="text-sm text-slate-500">
                            {processed.activePostersCount > 0
                                ? "Scroll down to see all participants. Hover over the bars to see forum breakdown."
                                : "No active posts match your current filters."}
                        </p>
                    </div>

                    {processed.posters.length > 0 ? (
                        <div className="overflow-y-auto overflow-x-hidden max-h-[600px] pr-2 custom-scrollbar border-y border-slate-50">
                            <div style={{ height: chartHeight }}>
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart
                                        data={processed.posters}
                                        layout="vertical"
                                        margin={{ top: 10, right: 30, left: 60, bottom: 5 }}
                                    >
                                        <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#e2e8f0" />
                                        <XAxis type="number" tick={{fontSize: 12, fill: '#64748b'}} axisLine={false} tickLine={false} />
                                        <YAxis dataKey="name" type="category" width={140} tick={{fontSize: 12, fill: '#475569', fontWeight: 500}} axisLine={false} tickLine={false} />

                                        <Tooltip
                                            cursor={{fill: '#f8fafc'}}
                                            content={<CustomTooltip />}
                                        />

                                        <Legend
                                            layout="horizontal"
                                            verticalAlign="top"
                                            align="center"
                                            wrapperStyle={{ paddingBottom: '10px', fontSize: '12px' }}
                                        />

                                        {processed.activeForums.map((forumName, index) => (
                                            <Bar
                                                key={forumName}
                                                dataKey={forumName}
                                                stackId="a"
                                                fill={COLORS[index % COLORS.length]}
                                                barSize={24}
                                            />
                                        ))}
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    ) : (
                        <div className="h-64 flex items-center justify-center text-slate-400 flex-col gap-2">
                            <IconMessageSquare size={32} opacity={0.5} />
                            <p>No posts found for the selected filters.</p>
                        </div>
                    )}
                </div>

                {/* Secondary Chart: Forum Popularity */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col">
                        <h2 className="text-lg font-semibold text-slate-800 mb-2 flex items-center gap-2">
                            <IconLayoutList size={18} className="text-slate-400" />
                            Filtered Forums (By Posts)
                        </h2>

                        {processed.topForums.length > 0 ? (
                            <div className="h-72 flex-1 mt-4">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie
                                            data={processed.topForums}
                                            cx="50%"
                                            cy="45%"
                                            innerRadius={70}
                                            outerRadius={100}
                                            paddingAngle={2}
                                            dataKey="posts"
                                            nameKey="name"
                                        >
                                            {processed.topForums.map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                            ))}
                                        </Pie>
                                        <Tooltip
                                            formatter={(value) => [`${value} posts`, 'Contributions']}
                                            contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}
                                        />
                                        <Legend
                                            layout="vertical"
                                            verticalAlign="middle"
                                            align="right"
                                            wrapperStyle={{ fontSize: '11px', maxWidth: '150px' }}
                                        />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                        ) : (
                            <div className="flex-1 flex items-center justify-center text-slate-400 flex-col gap-2 min-h-[200px]">
                                <IconAlertCircle size={32} opacity={0.5} />
                                <p>No forum data to display.</p>
                            </div>
                        )}
                    </div>

                    {/* Text-based summary table */}
                    <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col overflow-hidden max-h-[400px]">
                        <h2 className="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2 shrink-0">
                            <IconMessageCircle size={18} className="text-slate-400" />
                            Data Summary
                        </h2>
                        <div className="overflow-y-auto flex-1 pr-2">
                            <table className="w-full text-sm text-left text-slate-600">
                                <thead className="text-xs text-slate-500 uppercase bg-slate-50 sticky top-0">
                                <tr>
                                    <th className="px-4 py-3 rounded-tl-lg">Forum Name</th>
                                    <th className="px-4 py-3 text-right">Posts</th>
                                    <th className="px-4 py-3 text-right rounded-tr-lg">Views</th>
                                </tr>
                                </thead>
                                <tbody>
                                {processed.topForums.map((forum, i) => (
                                    <tr key={i} className="border-b border-slate-50 last:border-0 hover:bg-slate-50 transition-colors">
                                        <td className="px-4 py-3 font-medium text-slate-800">{forum.name}</td>
                                        <td className="px-4 py-3 text-right font-bold text-indigo-600">{forum.posts}</td>
                                        <td className="px-4 py-3 text-right">{forum.views.toLocaleString()}</td>
                                    </tr>
                                ))}
                                {processed.topForums.length === 0 && (
                                    <tr>
                                        <td colSpan="3" className="px-4 py-8 text-center text-slate-400 italic">
                                            No data matches current filters
                                        </td>
                                    </tr>
                                )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        );
    }

    function StatCard({ icon, title, value, bg }) {
        return (
            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div className={`p-4 rounded-xl ${bg}`}>
                    {icon}
                </div>
                <div>
                    <p className="text-sm font-medium text-slate-500">{title}</p>
                    <p className="text-3xl font-bold text-slate-800">{value}</p>
                </div>
            </div>
        );
    }

    // Render Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
