<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good or Bad Governance? — Activity</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: transparent;
    color: #1B2A6B;
    padding: 0;
    margin: 0;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  /* Header */
  .header { margin-bottom: 20px; }
  .header-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #7A6030;
    margin-bottom: 6px;
  }
  .header-title {
    font-size: 20px;
    font-weight: 600;
    color: #1B2A6B;
    margin-bottom: 4px;
  }
  .header-sub {
    font-size: 13px;
    color: #4A5580;
    line-height: 1.6;
  }

  /* Progress bar */
  .progress {
    display: flex;
    gap: 5px;
    margin-bottom: 20px;
  }
  .pip {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(27,42,107,0.15);
    transition: background 0.35s ease;
  }
  .pip.done   { background: #2E6B4F; }
  .pip.active { background: #1B2A6B; }

  /* Card */
  .card {
    background: #fff;
    border: 1px solid rgba(27,42,107,0.12);
    border-radius: 12px;
    padding: 22px 24px;
    box-shadow: 0 2px 12px rgba(27,42,107,0.07);
  }

  .card-num {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8A96B8;
    margin-bottom: 8px;
  }

  .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 3px;
    margin-bottom: 12px;
  }
  .tag.board { background: rgba(27,42,107,0.1);  color: #1B2A6B; }
  .tag.exec  { background: rgba(46,107,79,0.1);  color: #2E6B4F; }
  .tag.both  { background: rgba(122,59,30,0.1);  color: #7A3B1E; }

  .scenario {
    font-size: 14.5px;
    line-height: 1.8;
    color: #1C1A15;
    margin-bottom: 18px;
  }

  /* Buttons */
  .btns { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    border: 1.5px solid rgba(27,42,107,0.2);
    background: #F5F2D6;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: #1B2A6B;
    transition: all 0.18s ease;
  }
  .btn:hover:not(:disabled) {
    border-color: #1B2A6B;
    background: #ECEACC;
  }
  .btn:disabled { cursor: default; }

  .btn.opt-good { border-color: #2E6B4F; color: #2E6B4F; background: rgba(46,107,79,0.06); }
  .btn.opt-bad  { border-color: #B03A1F; color: #B03A1F; background: rgba(176,58,31,0.06); }

  .btn.sel-good { background: #2E6B4F; border-color: #2E6B4F; color: #fff; }
  .btn.sel-bad  { background: #B03A1F; border-color: #B03A1F; color: #fff; }

  .btn.dim { opacity: 0.35; }

  /* Feedback */
  .feedback {
    display: none;
    margin-top: 14px;
    padding: 12px 15px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.7;
    color: #1C1A15;
  }
  .feedback.correct   { background: rgba(46,107,79,0.08);  border-left: 3px solid #2E6B4F; }
  .feedback.incorrect { background: rgba(176,58,31,0.07);  border-left: 3px solid #B03A1F; }

  /* Next button */
  .next-btn {
    display: none;
    width: 100%;
    margin-top: 12px;
    padding: 10px 0;
    border-radius: 8px;
    border: none;
    background: #1B2A6B;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .next-btn:hover { opacity: 0.88; }

  /* Score screen */
  .score-screen {
    text-align: center;
    padding: 28px 20px 20px;
  }
  .score-big {
    font-size: 48px;
    font-weight: 600;
    color: #1B2A6B;
    line-height: 1;
    margin-bottom: 6px;
  }
  .score-pct {
    font-size: 13px;
    color: #4A5580;
    margin-bottom: 20px;
  }
  .score-divider {
    width: 36px;
    height: 2px;
    background: rgba(27,42,107,0.2);
    margin: 0 auto 20px;
    border-radius: 1px;
  }
  .score-msg {
    font-size: 13.5px;
    line-height: 1.8;
    color: #3A3830;
    max-width: 460px;
    margin: 0 auto 24px;
  }
  .restart-btn {
    padding: 9px 28px;
    border-radius: 8px;
    border: 1.5px solid rgba(27,42,107,0.25);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #1B2A6B;
    cursor: pointer;
    transition: all 0.18s;
  }
  .restart-btn:hover {
    background: rgba(27,42,107,0.06);
    border-color: #1B2A6B;
  }

  @media (max-width: 480px) {
    .card { padding: 18px 16px; }
    .btns { flex-direction: column; }
    .score-big { font-size: 40px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="progress" id="progress"></div>
  <div class="card" id="card-area"></div>
</div>

<script>
  const scenarios = [
    {
      num: "Scenario 1 of 5",
      tag: "board", tagLabel: "Board independence",
      text: "A family business recently listed on the stock exchange. The founding family holds 55% of shares and has nominated four of the seven board seats — all filled by family members or long-time family associates. The remaining three directors are independent. When a proposal to expand into a new market comes to the board, the family bloc votes together to approve it over the objections of all three independent directors, who raised concerns about the financial risks. The chair — also the family patriarch — closes the discussion after 20 minutes.",
      answer: "bad",
      feedback: "A majority shareholder has the legal right to appoint directors and vote their shares — so on the surface, nothing here is technically wrong. The problem is subtler: the board is being used as a rubber stamp rather than a genuine oversight body. When independent directors raise substantive concerns and are overruled without meaningful engagement, the board's oversight function is hollow. Good governance requires that minority shareholder perspectives are genuinely heard, not just procedurally noted."
    },
    {
      num: "Scenario 2 of 5",
      tag: "exec", tagLabel: "Executive authority",
      text: "A company's head of procurement discovers that one of its key suppliers is likely to go bankrupt within weeks. Acting quickly, she negotiates and signs a two-year supply contract with an alternative supplier at favorable terms — before the supplier becomes unavailable. The contract value is above her usual spending authority, but she informs the CFO the same day and the board at its next scheduled meeting two weeks later. The decision proves to be the right one.",
      answer: "good",
      feedback: "Good governance is not just about following process — it's about judgment. Waiting for board approval in a fast-moving situation that threatened the company's supply chain would have caused real harm. Acting, then disclosing promptly and fully, is a sign of responsible executive judgment, not a governance breach. What matters is that the decision was made in the company's interest, not personal interest, and that the board was informed as soon as practically possible."
    },
    {
      num: "Scenario 3 of 5",
      tag: "both", tagLabel: "Conflict of interest",
      text: "A board member who chairs the audit committee used to be the company's CFO before retiring five years ago. He is widely respected and has deep knowledge of the company's financial systems. The current CFO regularly seeks his informal advice before board meetings, and the two have lunch monthly. During a review of a complex accounting treatment, the audit committee chair defends management's position strongly and helps explain it to other board members.",
      answer: "bad",
      feedback: "This is a layered conflict that is easy to miss. The audit committee chair's job is to scrutinise management's financial decisions on behalf of the board — but his close ongoing relationship with the CFO, and his habit of being briefed before meetings, means he has effectively become an extension of management rather than an independent check on it. His expertise is valuable, but his independence is compromised. The audit committee's credibility depends on the chair being genuinely separate from the team he is supposed to oversee."
    },
    {
      num: "Scenario 4 of 5",
      tag: "board", tagLabel: "Board oversight",
      text: "A non-executive director has been on the board for nine years and chairs the risk committee. She is highly effective — she asks sharp questions, has built strong relationships with the management team, and is considered the board's most knowledgeable member on the company's industry. The board has decided not to impose a tenure limit, arguing that losing her institutional knowledge would be more damaging than any theoretical independence concerns.",
      answer: "bad",
      feedback: "Long tenure is one of the most commonly overlooked governance risks. The director's effectiveness is real — but effectiveness and independence are different things. After nine years, a director's relationships with management, familiarity with past decisions, and emotional investment in the company's direction can make it genuinely hard to challenge the people she has worked closely with. Most governance codes flag nine or more years as a threshold where independence should be formally assessed. Retaining her as an advisor while refreshing the board seat would preserve her value without the independence cost."
    },
    {
      num: "Scenario 5 of 5",
      tag: "exec", tagLabel: "Executive role",
      text: "The CEO of a mid-sized company is approached by a private equity firm exploring a potential buyout of the company. Rather than immediately informing the board, the CEO holds two exploratory meetings with the PE firm to better understand the offer and assess whether it is serious — reasoning that she does not want to distract the board with speculative conversations. She discloses the approach to the board chair after the second meeting.",
      answer: "bad",
      feedback: "A takeover approach is exactly the kind of matter the board — not the CEO — should be leading. By holding two meetings before informing the board, the CEO has effectively filtered and shaped the board's access to a material strategic event. Even if the intention was to avoid distraction, this crosses into the board's territory: evaluating strategic alternatives on behalf of shareholders. The CEO also has a potential personal interest in the outcome of any buyout, which makes independent board involvement even more important from the first contact."
    }
  ];

  let current = 0;
  let score = 0;
  let answered = false;

  function renderProgress() {
    const el = document.getElementById('progress');
    el.innerHTML = scenarios.map((_, i) => {
      let cls = 'pip';
      if (i < current) cls += ' done';
      else if (i === current) cls += ' active';
      return `<div class="${cls}"></div>`;
    }).join('');
  }

  function renderCard() {
    answered = false;
    const s = scenarios[current];
    document.getElementById('card-area').innerHTML = `
      <div class="card-num">${s.num}</div>
      <span class="tag ${s.tag}">${s.tagLabel}</span>
      <div class="scenario">${s.text}</div>
      <div class="btns">
        <button class="btn opt-good" id="btn-good" onclick="judge('good')">✓ Good governance</button>
        <button class="btn opt-bad"  id="btn-bad"  onclick="judge('bad')">✗ Bad governance</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextCard()">
        ${current < scenarios.length - 1 ? 'Next scenario →' : 'See my results'}
      </button>
    `;
    renderProgress();
  }

  function judge(choice) {
    if (answered) return;
    answered = true;
    const s = scenarios[current];
    const correct = choice === s.answer;
    if (correct) score++;

    const btnGood = document.getElementById('btn-good');
    const btnBad  = document.getElementById('btn-bad');
    btnGood.onclick = null;
    btnBad.onclick  = null;
    btnGood.disabled = true;
    btnBad.disabled  = true;

    // Style chosen button
    if (choice === 'good') {
      btnGood.className = correct ? 'btn sel-good' : 'btn sel-good dim';
    } else {
      btnBad.className  = correct ? 'btn sel-bad'  : 'btn sel-bad dim';
    }

    // Reveal correct answer if wrong
    if (!correct) {
      if (s.answer === 'good') btnGood.className = 'btn sel-good';
      if (s.answer === 'bad')  btnBad.className  = 'btn sel-bad';
    }

    // Feedback
    const fb = document.getElementById('feedback');
    fb.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
    fb.innerHTML = (correct ? '<strong>Correct.</strong> ' : '<strong>Not quite.</strong> ') + s.feedback;
    fb.style.display = 'block';

    document.getElementById('next-btn').style.display = 'block';
  }

  function nextCard() {
    current++;
    if (current >= scenarios.length) {
      renderScore();
    } else {
      renderCard();
    }
  }

  function renderScore() {
    const pct = Math.round((score / scenarios.length) * 100);
    let msg = '';
    if (score === 5) {
      msg = "Perfect score. You have a strong grasp of how roles and accountability should be structured across board and executive layers — and where the critical boundaries lie.";
    } else if (score >= 3) {
      msg = "Good instincts. Review the scenarios you missed — the key pattern to watch is where oversight ends and operational authority begins, and how conflicts of interest must always be disclosed proactively.";
    } else {
      msg = "Governance boundaries can be subtle. The core principle: the board sets direction and holds executives accountable; executives manage and propose. Any blurring of that boundary — or undisclosed conflict — is a governance red flag.";
    }

    document.getElementById('progress').innerHTML = scenarios.map(() => `<div class="pip done"></div>`).join('');
    document.getElementById('card-area').innerHTML = `
      <div class="score-screen">
        <div class="score-big">${score} / ${scenarios.length}</div>
        <div class="score-pct">${pct}% correct</div>
        <div class="score-divider"></div>
        <div class="score-msg">${msg}</div>
        <button class="restart-btn" onclick="restart()">Try again</button>
      </div>
    `;
  }

  function restart() {
    current = 0;
    score = 0;
    renderCard();
  }

  renderCard();
</script>
</body>
</html>
